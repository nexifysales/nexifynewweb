name: Auto Deploy to gh-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Build static site
        run: bash deploy/build.sh

      - name: Deploy to gh-pages branch
        run: |
          if [ -d "deploy/dist" ]; then
            DIST="deploy/dist"
          elif [ -d "/tmp/nexify-dist" ]; then
            DIST="/tmp/nexify-dist"
          else
            echo "Build output not found!" && exit 1
          fi
          TMP_DIR=$(mktemp -d)
          cp -r "$DIST/." "$TMP_DIR/"
          if [ -d "functions" ]; then
            cp -r functions "$TMP_DIR/functions"
          fi
          cd "$TMP_DIR"
          git init -b gh-pages
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          touch .nojekyll
          git add -A
          git commit -m "Deploy from main @ ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin gh-pages --force
