# ============================================================
# Nginx Configuration για nexify.gr
# Τοποθέτηση: /etc/nginx/sites-available/nexify.gr
# Enable: ln -s /etc/nginx/sites-available/nexify.gr /etc/nginx/sites-enabled/
# ============================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name nexify.gr www.nexify.gr;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/nexify;
        allow all;
    }

    location / {
        return 301 https://nexify.gr$request_uri;
    }
}

# www HTTPS → non-www HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nexify.gr;

    ssl_certificate /etc/letsencrypt/live/nexify.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexify.gr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nexify.gr$request_uri;
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexify.gr;

    root /var/www/nexify;
    index index.php index.html;

    # SSL
    ssl_certificate /etc/letsencrypt/live/nexify.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexify.gr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json
        application/xml+rss image/svg+xml;

    # Large files (videos)
    client_max_body_size 100M;
    client_body_timeout 300s;

    # ─────────────────────────────────────────
    # SEO Redirects: .html → .php (301)
    # Backward compat για παλιά Google index
    # ─────────────────────────────────────────
    rewrite ^/energy\.html$               /energy.php               permanent;
    rewrite ^/ecosystem\.html$            /ecosystem.php            permanent;
    rewrite ^/virtual-office\.html$       /virtual-office.php       permanent;
    rewrite ^/partners\.html$             /partners.php             permanent;
    rewrite ^/careers\.html$              /careers.php              permanent;
    rewrite ^/faq\.html$                  /faq.php                  permanent;
    rewrite ^/contact\.html$              /contact.php              permanent;
    rewrite ^/gemi\.html$                 /gemi.php                 permanent;
    rewrite ^/terms\.html$                /terms.php                permanent;
    rewrite ^/privacy\.html$              /privacy.php              permanent;
    rewrite ^/cookies\.html$              /cookies.php              permanent;
    rewrite ^/virtual-office-apply\.html$ /virtual-office-apply.php permanent;

    # PHP Processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Static Files Caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|PNG|SVG)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # MP4 Videos (range requests for seek/pause support)
    location ~* \.mp4$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=604800";
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
        access_log off;
    }

    # PDF files
    location ~* \.pdf$ {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Disposition "inline";
    }

    # Block hidden files (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block deploy folder
    location ^~ /deploy {
        deny all;
        return 404;
    }

    # Block sensitive extensions
    location ~* \.(sql|log|env|sh|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block dev-only files
    location ~* (responsive-preview|ticket_files|test_file) {
        deny all;
        return 404;
    }

    # Main location
    location / {
        try_files $uri $uri/ $uri.php =404;
    }

    # Error pages
    error_page 404 /index.php;
    error_page 500 502 503 504 /index.php;

    # Logs
    access_log /var/log/nginx/nexify.access.log;
    error_log  /var/log/nginx/nexify.error.log warn;
}
